<!doctype html>

<body>
<title>Six Years of XLS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* 版面：左欄說明卡、右邊 3D 畫面，兩邊不重疊；手機時說明卡在下方。說明卡可以收起。單一深色世界，刻意不做淺色版。 */
:root {
  --bg: #0a1020;          /* 深夜藍，畫布底色 */
  --panel: #0e1630;
  --line: rgba(160, 180, 220, 0.18);
  --fg: #e9edf7;
  --muted: #a3afcc;
  --accent: #f0b54c;      /* 琥珀：現在、焦點、register、OpenAI */
  --flow: #58d1c4;        /* 青：資料與訊息、Antmicro */
  --warn: #ff7b8e;        /* 粉紅：bug、停掉的提案 */
  --google: #5f82d6;
  --openai: #f0b54c;
  --antmicro: #58d1c4;
  --other: #8c95ab;
  --side: 400px;
  --font-display: "Spectral", Georgia, "Times New Roman", serif;
  --font-body: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "Menlo", "Consolas", monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  overflow: hidden;
}
#app { display: flex; width: 100%; height: 100%; }

/* 左欄：說明 */
#side {
  flex: 0 0 var(--side); width: var(--side); min-height: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--panel); border-right: 1px solid var(--line);
  padding-left: env(safe-area-inset-left, 0px); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: flex-basis .25s ease, width .25s ease;
}
#side.folded { flex-basis: 0; width: 0; border-right: 0; }
#side .body { flex: 1 1 auto; min-height: 0; overflow: auto; width: var(--side); padding: 18px 20px 16px; }
#side .ctl { flex: 0 0 auto; width: var(--side); border-top: 1px solid var(--line); padding: 12px 20px 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
#side .ctl:empty { display: none; }
#side .eyebrow { font: 600 11px/1 var(--font-mono); letter-spacing: .12em; color: var(--accent); text-transform: uppercase; margin-bottom: 10px; }
#side .eyebrow.c { color: var(--flow); }
#side h2 { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.3; margin: 0 0 10px; text-wrap: balance; }
#side p { margin: 0 0 10px; color: var(--fg); }
#side p b { color: var(--accent); font-weight: 700; }
#side p.note { color: var(--muted); font-size: 13.5px; }
#side ol { margin: 0 0 10px; padding-left: 1.3em; }
#side li { margin-bottom: 6px; }
.btn {
  appearance: none; border: 1px solid var(--accent); background: transparent; color: var(--accent);
  font: 500 14px/1 var(--font-body); padding: 10px 14px; border-radius: 10px; cursor: pointer;
}
.btn.primary { background: var(--accent); color: #1a1200; font-weight: 700; }
.btn.flow { border-color: var(--flow); color: var(--flow); }
.btn.flow.primary { background: var(--flow); color: #06201c; }
.btn:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }
.btn[aria-pressed="true"] { background: var(--flow); border-color: var(--flow); color: #06201c; }
.readout { font: 600 13px/1.3 var(--font-mono); color: var(--flow); }
.readout.bad { color: var(--warn); }
.readout.wide { flex: 1 1 100%; font-weight: 500; color: var(--fg); }
input[type=range] { width: 100%; accent-color: var(--accent); }
.slider { flex: 1 1 100%; min-width: 0; }
.slider label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: var(--sw); }
.kv { font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.kv b { color: var(--fg); font-weight: 600; }
/* 區域熱度：這一年動得最多的目錄 */
.heat-h { font: 600 11px/1 var(--font-mono); letter-spacing: .08em; color: var(--muted); margin: 10px 0 6px; }
.heat { list-style: none; padding: 0; margin: 0 0 6px; display: grid; gap: 4px; font-size: 12.5px; }
.heat li { display: grid; grid-template-columns: 12.5em 1fr 3.2em; align-items: center; gap: 8px; color: var(--muted); margin: 0; }
.heat .bar { height: 8px; border-radius: 4px; background: var(--google); opacity: .9; }
.heat li.hot .bar { background: var(--accent); }
.heat b { color: var(--fg); font-weight: 500; text-align: right; font: 500 12px/1 var(--font-mono); }

/* 右邊：3D 畫面，上方是兩條線的切換與站號，右下是導覽鍵 */
#stage { flex: 1 1 auto; min-width: 0; position: relative; }
#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#c.dragging { cursor: grabbing; }
#top {
  position: absolute; top: 0; left: 0; right: 0; z-index: 5;
  padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-left: 16px; padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 8px 14px; pointer-events: none; flex-wrap: wrap;
}
#top .brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .04em; color: var(--accent); white-space: nowrap; cursor: pointer; pointer-events: auto; }
#tracks { display: flex; gap: 6px; pointer-events: auto; }
#tracks button {
  appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.75); color: var(--muted);
  font: 600 12.5px/1 var(--font-body); padding: 8px 12px; border-radius: 999px; cursor: pointer; letter-spacing: .04em;
}
#tracks button[aria-pressed="true"] { background: var(--fg); color: #0a1020; border-color: var(--fg); }
#tracks button:focus-visible, #dots button:focus-visible, #fold:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }
#dots { display: flex; gap: 6px; align-items: center; pointer-events: auto; flex-wrap: wrap; }
#dots button {
  appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.7); color: var(--muted);
  font: 500 11px/1 var(--font-mono); padding: 6px 8px; border-radius: 999px; cursor: pointer; letter-spacing: .02em;
}
#dots button[aria-current="step"] { background: var(--accent); color: #1a1200; border-color: var(--accent); font-weight: 600; }
#dots[hidden] { display: none; }
#fold { margin-left: auto; pointer-events: auto; appearance: none; border: 1px solid var(--line); background: rgba(10,16,32,.75); color: var(--muted); font: 500 12px/1 var(--font-body); padding: 8px 11px; border-radius: 999px; cursor: pointer; }
#nav { position: absolute; z-index: 6; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; }
#nav button {
  appearance: none; border: 1px solid var(--line); background: rgba(13,20,40,.9); color: var(--fg);
  font: 500 14px/1 var(--font-body); padding: 12px 16px; border-radius: 10px; cursor: pointer; backdrop-filter: blur(10px);
}
#nav button:disabled { opacity: .35; cursor: default; }
#nav button:focus-visible { outline: 2px solid var(--flow); outline-offset: 2px; }
#hint { position: absolute; z-index: 4; left: 16px; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); pointer-events: none; opacity: .9; }

@media (max-width: 720px) {
  #app { flex-direction: column-reverse; }
  #side { flex: 0 0 46%; width: 100%; border-right: 0; border-top: 1px solid var(--line); padding-left: 0; padding-top: 0; transition: flex-basis .25s ease; }
  #side.folded { flex-basis: 0; border-top: 0; }
  #side .body, #side .ctl { width: 100%; }
  #side .body { padding: 14px 16px 10px; }
  #side h2 { font-size: 16.5px; }
  #top { padding-left: 12px; padding-right: 12px; }
  #nav { bottom: 12px; right: 12px; }
  #nav button { padding: 10px 12px; }
  #hint { display: none; }
  #top .brand { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <aside id="side" aria-live="polite">
    <div class="body"><div class="eyebrow" id="p-eyebrow"></div><h2 id="p-title"></h2><div id="p-html"></div></div>
    <div class="ctl" id="p-ctl"></div>
  </aside>
  <div id="stage">
    <canvas id="c" aria-label="3D scene of the XLS journey"></canvas>
    <div id="top">
      <div class="brand" id="brand" title="Back to start">Six Years of XLS</div>
      <div id="tracks" role="tablist" aria-label="Two tracks"><button type="button" id="tab-h" aria-pressed="false">History: people and direction</button><button type="button" id="tab-c" aria-pressed="false">Concepts: five basics</button></div>
      <div id="dots" role="tablist" aria-label="Stations"></div>
      <button id="fold" type="button" aria-expanded="true">Hide notes</button>
    </div>
    <div id="nav"><button id="prev" type="button">Previous</button><button id="next" type="button">Next</button></div>
    <div id="hint">Drag to orbit · arrow keys change station</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  if (!window.THREE) { document.getElementById('p-html').innerHTML = '<p class="note">The 3D library did not load. Please reload the page.</p>'; return; }
  const RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const C = { bg: 0x0a1020, accent: 0xf0b54c, flow: 0x58d1c4, warn: 0xff7b8e, google: 0x5f82d6, openai: 0xf0b54c, antmicro: 0x58d1c4, other: 0x8c95ab, slab: 0x1a2440, slab2: 0x233052, text: '#e9edf7', muted: '#a3afcc' };
  const GAP = 130;     // 概念站與站的距離（鏡頭拉遠後一站可見 90 單位寬，站距要比它大）
  const CZ = -900;     // 概念世界放在 z = -900，跟封面與歷史世界互不入鏡（fog 到 340 就看不見）
  const COVER_Z = -400;
  const YW = 24;       // 歷史世界：一年 24 單位
  const yx = t => (t - 2020) * YW;
  const hex = c => '#' + c.toString(16).padStart(6, '0');

  // ---------- renderer / scene ----------
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(C.bg);
  scene.fog = new THREE.Fog(C.bg, 140, 340);
  const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 900);
  scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x0a1020, 0.9));
  const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(30, 60, 40); scene.add(key);
  const fill = new THREE.DirectionalLight(0x58d1c4, 0.25); fill.position.set(-40, 20, -30); scene.add(fill);

  (function stars() {
    const n = 1800, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { pos[i * 3] = (Math.random() - 0.3) * 1000; pos[i * 3 + 1] = Math.random() * 200 - 20; pos[i * 3 + 2] = -120 - Math.random() * 600; }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0x9fb4e8, size: 0.9, sizeAttenuation: true, transparent: true, opacity: 0.7 })));
  })();

  // ---------- helpers ----------
  function label(text, o) {
    o = o || {};
    const size = o.size || 26, pad = 14, font = (o.weight || 500) + ' ' + size + 'px ' + (o.mono ? '"JetBrains Mono", Menlo, monospace' : '"Source Sans 3", "Helvetica Neue", Arial, sans-serif');
    const lines = String(text).split('\n');
    const cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    ctx.font = font;
    const w = Math.max.apply(null, lines.map(l => ctx.measureText(l).width)) + pad * 2, lh = size * 1.3, h = lh * lines.length + pad * 2;
    cv.width = Math.ceil(w); cv.height = Math.ceil(h);
    ctx.font = font; ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
    if (o.bg) { ctx.fillStyle = o.bg; roundRect(ctx, 0, 0, cv.width, cv.height, 10); ctx.fill(); }
    ctx.fillStyle = o.color || C.text;
    lines.forEach((l, i) => ctx.fillText(l, cv.width / 2, pad + lh * (i + 0.5)));
    const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter; tex.encoding = THREE.sRGBEncoding;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
    const s = o.scale || 0.03; sp.scale.set(cv.width * s, cv.height * s, 1);
    return sp;
  }
  function roundRect(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function mat(color, o) { o = o || {}; return new THREE.MeshStandardMaterial({ color, roughness: o.rough != null ? o.rough : 0.55, metalness: o.metal || 0.1, emissive: o.emissive || 0x000000, emissiveIntensity: o.ei != null ? o.ei : 1, transparent: !!o.opacity, opacity: o.opacity != null ? o.opacity : 1, side: o.side || THREE.FrontSide }); }
  function box(w, h, d, color, o) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color, o)); }
  function ball(r, color, o) { return new THREE.Mesh(new THREE.SphereGeometry(r, 20, 16), mat(color, o)); }
  function line(points, color, opacity) { const g = new THREE.BufferGeometry().setFromPoints(points); return new THREE.Line(g, new THREE.LineBasicMaterial({ color, transparent: true, opacity: opacity == null ? 0.8 : opacity })); }
  function dashed(points, color, opacity) { const g = new THREE.BufferGeometry().setFromPoints(points); const l = new THREE.Line(g, new THREE.LineDashedMaterial({ color, dashSize: 1.2, gapSize: 0.8, transparent: true, opacity: opacity == null ? 0.9 : opacity })); l.computeLineDistances(); return l; }
  function tube(points, r, color, o) { const curve = new THREE.CatmullRomCurve3(points); const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, r, 8, false), mat(color, o)); m.userData.curve = curve; return m; }
  function arrow(from, to, color) { const dir = new THREE.Vector3().subVectors(to, from); const len = dir.length(); return new THREE.ArrowHelper(dir.normalize(), from, len, color, Math.min(1.8, len * 0.3), 0.9); }
  function plane(w, h, color, opacity) { return new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide, depthWrite: false })); }
  function platform(w, d, x, z, color) { const m = box(w, 0.6, d, color || C.slab, { rough: 0.8 }); m.position.set(x, -0.3, z); return m; }
  function clear(group) { while (group.children.length) { const ch = group.children.pop(); group.remove(ch); ch.traverse && ch.traverse(n => { if (n.geometry) n.geometry.dispose(); if (n.material) { if (n.material.map) n.material.map.dispose(); n.material.dispose(); } }); } }
  const V = (x, y, z) => new THREE.Vector3(x, y, z);
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
  const st = { t: 0 };

  // =====================================================================
  //  資料（窗口 2020-05-13 → 2026-11-19；作者身分照 e-mail 網域分）
  // =====================================================================
  const YEARS = [2020, 2021, 2022, 2023, 2024, 2025, 2026];
  const DATA = { google: [679, 990, 952, 1393, 2062, 2149, 1665], antmicro: [0, 0, 0, 27, 63, 129, 38], openai: [0, 0, 0, 0, 172, 251, 98], other: [185, 43, 37, 56, 36, 70, 82] };
  // 動到的目錄（一個 commit 可以算進幾個區域）；「找 bug」算 commit 主旨提到 fuzz 的
  const AREAS = [
    ['Language DSLX', [312, 342, 207, 432, 670, 813, 464]],
    ['  ↳ type system v2', [0, 0, 0, 0, 18, 356, 191]],
    ['Intermediate form IR', [156, 138, 113, 152, 304, 230, 170]],
    ['Optimization passes', [73, 83, 107, 161, 362, 314, 349]],
    ['Verilog output (codegen)', [65, 105, 96, 96, 226, 197, 95]],
    ['Stage cutting (scheduling)', [21, 14, 35, 67, 91, 75, 73]],
    ['Bug finding (fuzz)', [17, 40, 77, 49, 49, 86, 122]],
    ['C++ front end (xlscc)', [19, 67, 162, 158, 155, 133, 88]],
    ['Command-line tools', [81, 87, 138, 142, 244, 117, 75]],
    ['C API (public)', [0, 14, 7, 15, 80, 127, 42]],
    ['MLIR dialect', [0, 0, 0, 0, 89, 129, 50]],
    ['ZSTD (Antmicro)', [0, 0, 0, 1, 62, 111, 17]],
    ['Delay / area estimation', [31, 21, 25, 34, 65, 21, 22]],
    ['On-chip network (noc)', [12, 66, 6, 19, 40, 5, 9]]
  ];
  function heat(yi, hot) {
    const rows = AREAS.map(a => [a[0], yi.reduce((s, i) => s + a[1][i], 0)]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 7);
    const mx = rows[0][1];
    return '<div class="heat-h">Busiest areas (commits)</div><ul class="heat">' + rows.map(r => '<li' + ((hot || []).indexOf(r[0]) >= 0 ? ' class="hot"' : '') + '><span>' + r[0] + '</span><span class="bar" style="width:' + Math.max(3, r[1] / mx * 100) + '%"></span><b>' + r[1] + '</b></li>').join('') + '</ul>';
  }
  // 人：每條線一段一段，lane 是當時的公司；數字是那個帳號的 commit 數
  const PEOPLE = [
    { n: 'Chris Leary (DSLX, the language)', author: true, segs: [['google', 2020.37, 2024.31, 1036], ['openai', 2024.37, 2026.87, 366]] },
    { n: 'Mark Heffernan (IR, scheduler, codegen)', author: true, segs: [['google', 2020.37, 2025.54, 715], ['openai', 2025.59, 2026.73, 52]] },
    { n: 'Rob Springer', segs: [['google', 2020.38, 2023.01, 414]] },
    { n: 'Sean Purser-Haskell (C++ front end xlscc)', segs: [['google', 2020.40, 2026.86, 325]] },
    { n: 'Paul Rigge', segs: [['google', 2020.78, 2026.88, 559]] },
    { n: 'Eric Astor', segs: [['google', 2021.28, 2026.81, 695]] },
    { n: 'Henner Zeller', segs: [['google', 2023.12, 2026.65, 457], ['other', 2026.67, 2026.78, 56]] },
    { n: 'Alex Light', segs: [['google', 2023.55, 2026.88, 907]] },
    { n: 'Rich McKeever', segs: [['google', 2024.27, 2026.88, 464]] },
    { n: 'David Plass', segs: [['google', 2024.56, 2026.75, 532]] },
    { n: 'Daniel Killebrew', segs: [['openai', 2025.15, 2026.86, 47]] },
    { n: 'Sirui Lu', segs: [['openai', 2025.56, 2026.04, 51]] },
    { n: 'Robert Winkler', segs: [['antmicro', 2023.37, 2026.69, 85]] },
    { n: 'Pawel Czarnecki', segs: [['antmicro', 2023.39, 2025.37, 60]] },
    { n: 'Antmicro, six others', segs: [['antmicro', 2023.9, 2026.6, 112]] },
    { n: 'Hans Montero (Columbia University intern)', segs: [['other', 2020.46, 2020.64, 114]] }
  ];
  const EVENTS = [
    [2020.37, 'Google open-sources XLS: Leary on the language, Heffernan on IR and codegen'],
    [2020.46, 'Intern Montero joins: 114 commits in one summer'],
    [2021.3, 'procs and channels enter the IR: modules with state that pass messages'],
    [2022.35, 'SDC scheduler, AOT; C++ front end at its peak; main line ①: proc inlining'],
    [2023.12, 'Zeller joins Google'],
    [2023.2, 'LSP, FFI; dslx_fmt gets 104 commits this year'],
    [2023.37, 'First Antmicro commit'],
    [2023.45, 'Main line ②: proc-scoped channels design doc'],
    [2023.75, 'Antmicro starts the ZSTD decoder'],
    [2024.31, 'Leary’s last Google commit'],
    [2024.33, 'xlsynth created (2024-04-29)'],
    [2024.37, 'Leary’s first commit back upstream, from OpenAI'],
    [2024.7, 'MLIR dialect open-sourced; delay and area estimators merged'],
    [2024.87, 'Type system v2 begins'],
    [2025.15, 'Killebrew (OpenAI) starts sending DSLX changes'],
    [2025.37, 'Main line ③: synchronous procs proposal'],
    [2025.54, 'Heffernan’s last Google commit; the proposal stalls'],
    [2025.59, 'Heffernan returns, from OpenAI'],
    [2025.73, 'xlsynth switches to numbered releases, v0.2.0'],
    [2025.87, 'codegen 1.5 begins'],
    [2026.1, 'Explicit State Access'],

          if (local > 0.92 && p.hold < 0.6 && seg < 3) { p.hold += dt; } else { p.t = (p.t + dt * 0.14) % 1; if (local < 0.05) p.hold = 0; }
        }
        p.m.position.set(X - 26 + p.t * 52, 2.5 + Math.sin(st.t * 3 + k) * 0.2, 0);
      });
    }
  });
  function applyUnified() { if (!st.sysSep) return; st.sysSep.visible = !st.unified; st.sysUni.visible = !!st.unified; }

  // C5 翻譯一定正確
  S.push({
    track: 'c', dot: '5',
    eyebrow: 'Concepts · station 5',
    title: 'Translation always correct: random programs, three ways to run, bit-for-bit comparison',
    html: '<p>The same program runs three ways: the interpreter, JIT compilation, and simulation of the generated Verilog, and the results are compared bit for bit. Thousands of randomly generated programs go through this every day; any mismatch is a bug in the tool, never the user’s problem. A separate tool uses an SMT solver to prove two IRs equivalent before and after optimization.</p><p>Press “Throw in a random program” to watch one comparison; every fourth one hits a deliberately planted mismatch.</p>',
    ctl: '<button class="btn primary" id="fuzz" type="button">Throw in a random program</button><span class="kv" id="fuzz-out">programs <b>0</b> · bugs <b>0</b></span>',
    init() { st.fz = { n: 0, bugs: 0, run: -1 }; document.getElementById('fuzz').onclick = () => { if (st.fz.run >= 0) return; st.fz.run = 0; st.fz.n++; st.fz.isBug = st.fz.n % 4 === 0; st.fz.val = (Math.random() * 0xffff | 0).toString(16).padStart(4, '0'); }; },
    cam: { pos: V(GAP * 4, 30, CZ + 62), target: V(GAP * 4, 2, CZ) },
    build(g) {
      g.position.z = CZ;
      const X = GAP * 4; g.add(platform(50, 20, X, 0));
      const gen = box(4, 4, 4, C.slab2, { rough: 0.4 }); gen.position.set(X - 20, 3, 0); g.add(gen); st.gen = gen;
      const gl = label('Random program\ngenerator', { size: 20, scale: 0.022 }); gl.position.set(X - 20, 7, 0); g.add(gl);
      st.lanes = ['Interpreter', 'JIT compile', 'Verilog sim'].map((n, i) => {
        const z = (i - 1) * 6.5;
        const m = box(5, 3, 3.5, 0x2a3659, { rough: 0.5 }); m.position.set(X - 2, 2.5, z); g.add(m);
        const l = label(n, { size: 20, scale: 0.022 }); l.position.set(X - 2, 5.2, z); g.add(l);
        g.add(tube([V(X - 18, 3, 0), V(X - 10, 3, z * 0.6), V(X - 4.6, 3, z)], 0.18, C.flow, { opacity: 0.35 }));
        g.add(tube([V(X + 0.6, 3, z), V(X + 7, 3, z * 0.6), V(X + 14, 3, 0)], 0.18, C.flow, { opacity: 0.35 }));
        const pk = ball(0.5, C.accent, { emissive: C.accent, ei: 1 }); pk.visible = false; g.add(pk);
        const res = new THREE.Group(); res.position.set(X + 7, 5.6, z); g.add(res);
        return { z, pk, res, m };
      });
      st.cmp = box(5, 5, 5, C.slab2, { rough: 0.4 }); st.cmp.position.set(X + 17, 3, 0); g.add(st.cmp);
      const cl = label('Bit-for-bit compare', { size: 20, scale: 0.022 }); cl.position.set(X + 17, 7, 0); g.add(cl);
      st.cmpOut = new THREE.Group(); st.cmpOut.position.set(X + 17, 9.4, 0); g.add(st.cmpOut);
      const z3 = box(4, 2.4, 3, 0x3a2f55, { rough: 0.6 }); z3.position.set(X + 17, 1.2, 9); g.add(z3);
      const zl = label('SMT solver\nproves two IRs equivalent', { size: 18, scale: 0.02, color: '#a3afcc' }); zl.position.set(X + 17, 4.4, 9); g.add(zl);
    },
    tick(dt) {
      const f = st.fz; if (!f || f.run < 0) return;
      f.run += dt; const X = GAP * 4;
      if (!RM) st.gen.rotation.y += dt * 3;
      st.lanes.forEach((L, i) => {
        const t1 = Math.min(1, f.run / 1.0);
        if (f.run < 1.0) { L.pk.visible = true; L.pk.position.set(lerp(X - 18, X - 4.6, t1), 3, lerp(0, L.z, t1)); }
        else if (f.run < 2.1) { const t2 = (f.run - 1.0) / 1.1; L.pk.position.set(lerp(X + 0.6, X + 14, t2), 3, lerp(L.z, 0, t2)); if (L.res.children.length === 0) { const bad = f.isBug && i === 2; const v = bad ? (parseInt(f.val, 16) ^ 0x0100).toString(16).padStart(4, '0') : f.val; const s = label('0x' + v, { mono: true, size: 20, color: bad ? '#ff7b8e' : '#58d1c4', bg: 'rgba(10,16,32,.85)', scale: 0.022 * LK }); L.res.add(s); } }
        else { L.pk.visible = false; }
      });
      if (f.run >= 2.1 && st.cmpOut.children.length === 0) {
        if (f.isBug) f.bugs++;
        const s = label(f.isBug ? 'Mismatch: a bug in the tool' : 'Match', { size: 22, weight: 600, color: f.isBug ? '#ff7b8e' : '#58d1c4', bg: 'rgba(10,16,32,.85)', scale: 0.024 * LK }); st.cmpOut.add(s);
        st.cmp.material.emissive.setHex(f.isBug ? C.warn : C.flow); st.cmp.material.emissiveIntensity = 0.6;
        document.getElementById('fuzz-out').innerHTML = 'programs <b>' + f.n + '</b> · bugs <b>' + f.bugs + '</b>';
      }
      if (f.run > 3.6) { f.run = -1; clear(st.cmpOut); st.lanes.forEach(L => clear(L.res)); st.cmp.material.emissiveIntensity = 0; }
    }
  });

  // ---------- build all ----------
  const LK = 1.6;   // 概念世界的字的放大倍率
  function buildAll() { S.forEach(s => { const g = new THREE.Group(); scene.add(g); stationGroups.push(g); s.build(g); if (s.track === 'c') g.traverse(n => { if (n.isSprite) n.scale.multiplyScalar(LK); }); }); }
  const TRACKS = { h: [], c: [] };
  S.forEach((s, i) => { if (TRACKS[s.track]) TRACKS[s.track].push(i); });

  // ---------- UI ----------
  const dots = document.getElementById('dots'), tabH = document.getElementById('tab-h'), tabC = document.getElementById('tab-c');
  tabH.onclick = () => goTo(S[cur].track === 'h' ? cur : TRACKS.h[0]);
  tabC.onclick = () => goTo(S[cur].track === 'c' ? cur : TRACKS.c[0]);
  document.getElementById('brand').onclick = () => goTo(0);
  let dotsTrack = null;
  function buildDots(track) {
    if (dotsTrack === track) return; dotsTrack = track; dots.innerHTML = '';
    if (!TRACKS[track]) { dots.hidden = true; return; }
    dots.hidden = false;
    TRACKS[track].forEach(i => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.textContent = S[i].dot; b.title = S[i].title; b.onclick = () => goTo(i); dots.appendChild(b); });
  }
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  function step(d) { const list = TRACKS[S[cur].track]; if (!list) { if (d > 0) goTo(TRACKS.h[0]); return; } const k = list.indexOf(cur) + d; if (k < 0) goTo(0); else if (k < list.length) goTo(list[k]); }
  prev.onclick = () => step(-1); next.onclick = () => step(1);
  window.addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1); if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1); });

  let cur = -1;
  const camFrom = { pos: new THREE.Vector3(), target: new THREE.Vector3() }, camTo = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
  const camNow = { pos: new THREE.Vector3(), target: new THREE.Vector3() };
  let camT = 1, orbit = { th: 0, ph: 0 };
  function goTo(i) {
    i = Math.max(0, Math.min(S.length - 1, i)); if (i === cur) return;
    cur = i; const s = S[i];
    stationGroups.forEach((g, k) => { if (S[k].onlyWhenCurrent) g.visible = k === i; });
    const ey = document.getElementById('p-eyebrow'); ey.textContent = s.eyebrow; ey.className = 'eyebrow' + (s.track === 'c' ? ' c' : '');
    document.getElementById('p-title').textContent = s.title;
    document.getElementById('p-html').innerHTML = s.html;
    document.getElementById('p-ctl').innerHTML = s.ctl || '';
    document.querySelector('#side .body').scrollTop = 0;
    s.init && s.init();
    buildDots(s.track);
    tabH.setAttribute('aria-pressed', String(s.track === 'h')); tabC.setAttribute('aria-pressed', String(s.track === 'c'));
    dots.querySelectorAll('button').forEach((b, k) => { if (TRACKS[s.track] && TRACKS[s.track][k] === i) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
    const list = TRACKS[s.track];
    prev.disabled = i === 0; next.disabled = list ? list.indexOf(i) === list.length - 1 : false;
    camFrom.pos.copy(camNow.pos); camFrom.target.copy(camNow.target);
    camTo.pos.copy(s.cam.pos); camTo.target.copy(s.cam.target);
    camT = RM ? 1 : 0; orbit.th = 0; orbit.ph = 0;
    try { localStorage.setItem('xls-journey-station', String(i)); } catch (e) {}
  }

  let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, th: orbit.th, ph: orbit.ph }; canvas.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag) return; orbit.th = drag.th - (e.clientX - drag.x) * 0.005; orbit.ph = Math.max(-0.5, Math.min(0.45, drag.ph + (e.clientY - drag.y) * 0.004)); });
  const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

  function resize() { const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w * renderer.getPixelRatio() || canvas.height !== h * renderer.getPixelRatio()) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); } }
  const sph = new THREE.Spherical(), off = new THREE.Vector3();
  const side = document.getElementById('side'), foldBtn = document.getElementById('fold');
  st.folded = false;
  foldBtn.onclick = () => { st.folded = !st.folded; side.classList.toggle('folded', st.folded); foldBtn.textContent = st.folded ? 'Show notes' : 'Hide notes'; foldBtn.setAttribute('aria-expanded', String(!st.folded)); };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; st.t += dt;
    resize();
    if (camT < 1) { camT = Math.min(1, camT + dt / 1.5); const k = ease(camT); camNow.pos.lerpVectors(camFrom.pos, camTo.pos, k); camNow.target.lerpVectors(camFrom.target, camTo.target, k); }
    else { camNow.pos.copy(camTo.pos); camNow.target.copy(camTo.target); }
    off.subVectors(camNow.pos, camNow.target); sph.setFromVector3(off); sph.theta += orbit.th; sph.phi = Math.max(0.2, Math.min(1.5, sph.phi + orbit.ph));
    if (camera.aspect < 1) sph.radius *= Math.pow(1 / camera.aspect, 0.85);   // 直立的手機：鏡頭退後，整個站才裝得進畫面
    off.setFromSpherical(sph);
    camera.position.copy(camNow.target).add(off); camera.lookAt(camNow.target);
    const s = S[cur]; if (s && s.tick) s.tick(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  let start = 0; try { start = Math.min(S.length - 1, parseInt(localStorage.getItem('xls-journey-station') || '0', 10) || 0); } catch (e) {}
  const hm = /[#&]s=(\d+)/.exec(location.hash || ''); if (hm) start = Math.min(S.length - 1, +hm[1]);
  function boot() { buildHistory(); buildAll(); camNow.pos.copy(S[start].cam.pos); camNow.target.copy(S[start].cam.target); goTo(start); requestAnimationFrame(frame); }
  // canvas 上的字在 build 時就畫死，所以先把字型抓下來；抓不到或太慢就直接開始
  let booted = false; const bootOnce = () => { if (!booted) { booted = true; boot(); } };
  const fontsReady = (document.fonts && document.fonts.load) ? Promise.all(['500 20px "Source Sans 3"', '600 20px "Source Sans 3"', '700 20px "Source Sans 3"', '600 20px "JetBrains Mono"'].map(f => document.fonts.load(f))) : Promise.resolve();
  fontsReady.then(bootOnce, bootOnce); setTimeout(bootOnce, 2500);
})();
</script>
